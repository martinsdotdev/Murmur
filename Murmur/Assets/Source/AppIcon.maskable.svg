<?xml version="1.0" encoding="UTF-8"?>
<!-- Maskable variant of AppIcon.svg, for the PWA manifest and the iOS home
     screen. Same gradient and same bars, with two deliberate differences:
     no rx, because a launcher mask larger than the 144 rounding would expose
     the transparent corners; and no 24-unit base strip, which reads as a dark
     arc once a circular mask crops the bottom.

     The mark already satisfies the maskable safe zone. Its furthest point from
     centre is about 235 units (the rounded corner of an outer bar), inside the
     307.2-unit safe radius that 0.4 x 768 gives, so nothing needed rescaling. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768">
  <defs>
    <radialGradient id="tile" cx="0.7" cy="0.15" r="0.95">
      <stop offset="0" stop-color="#FFEDC8"/>
      <stop offset="0.5" stop-color="#F5C375"/>
      <stop offset="1" stop-color="#A85820"/>
    </radialGradient>
  </defs>
  <rect width="768" height="768" fill="url(#tile)"/>
  <!-- Verbatim from AppIcon.svg. -->
  <rect x="192" y="216" width="96" height="312" rx="48" fill="#FFFFFF"/>
  <rect x="336" y="384" width="96" height="144" rx="48" fill="#FFFFFF"/>
  <rect x="480" y="216" width="96" height="312" rx="48" fill="#FFFFFF"/>
</svg>
